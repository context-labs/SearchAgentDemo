[project]
name = "halo-search-agent-example"
version = "0.1.0"
description = "A small OpenAI Agents SDK search agent instrumented for HALO trace analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Inference.net" }]
dependencies = [
    "inference-catalyst-tracing[openai-agents]>=0.1.0",
    "openai-agents[litellm]>=0.6.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "tavily-python>=0.7.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[project.scripts]
search-agent = "search_agent_example.cli:app"
search-agent-batch = "search_agent_example.batch:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_agent_example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
